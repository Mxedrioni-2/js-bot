apiVersion: apps/v1
kind: Deployment
metadata:
  name: js-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: js-bot
  template:
    metadata:
      labels:
        app: js-bot
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: js-bot
          image: docker.io/library/js-bot:latest
          imagePullPolicy: Never
          env:
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: BOT_TOKEN
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: SECRET_KEY
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: ADMIN_PASSWORD_HASH
          envFrom:
            - configMapRef:
                name: discord-bot-config